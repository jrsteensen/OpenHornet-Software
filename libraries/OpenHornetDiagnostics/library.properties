sentence=Backlight power-on test, DCS sync flash and diagnostic mode for the OpenHornet DDI and AMPCD boards with a plain LED backlight on a PWM pin.
paragraph=Non-blocking helper used by the 1A3, 1A9 and 2A3A1 sketches. Not for DDI/AMPCD boards with WS2812 backlighting or any other panel. Hold three pushbuttons for three seconds to enter or exit diagnostic mode; only available while no DCS mission is running (OpenHornetDcsMission.h).
