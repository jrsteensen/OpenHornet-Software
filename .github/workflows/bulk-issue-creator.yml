on:
  workflow_dispatch:
    inputs:
      write:
        description: "Change to 'true' to create issues, leave as 'false' to preview output"
        default: "false"
        type: boolean

name: Bulk issue creator

permissions:
  contents: read
  issues: write

jobs:
  bulk_issue_creator:
    runs-on: ubuntu-latest
    name: Bulk Issue Creator
    steps:
      - name: Checkout template and data
        uses: actions/checkout@v7.0.1
      - name: Create bulk issues
        # v2 is a floating tag with no finer release, so it is pinned to the commit it pointed at.
        uses: benbalter/bulk-issue-creator@331e909c873d19191cb36fc671234e4de292e67a # v2
        with:
          write: ${{ inputs.write }}
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
